name: Build and Test

on:
  push:
    paths:
      - "src/**"
      - "redis/**"
      - ".github/workflows/**"
      - "Cargo.toml"
    branches:
      - "**"
    tags-ignore:
      - "*.*.*"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/**"
      - "Cargo.toml"
    branches:
      - "**"

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Run cargo check
        run: cargo check
      - name: Run cargo check --release
        run: cargo check --release
      - name: Checking style
        run: cargo fmt --all -- --check

  # Enforce the panic policy declared in `src/lib.rs`: the explicit-panic family
  # crate-wide, plus `clippy::indexing_slicing` in `network/` and `resp/`. Those
  # are `deny`, so they already fail without `-D warnings`; the flag is what
  # makes an *unfulfilled* `#[expect(...)]` fail too, so a justification that no
  # longer applies gets removed instead of quietly outliving its reason.
  #
  # `--all-targets` only on the tokio matrix: the examples are `#[tokio::main]`,
  # so they do not build under `async-std-runtime` at all. That is why the
  # feature-compile job below uses `cargo check` rather than `--all-targets`.
  clippy:
    name: Clippy (panic policy)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: cargo clippy --all-targets (tokio)
        run: cargo clippy --all-targets --no-default-features --features tokio-runtime,tokio-rustls,pool,json,client-cache -- -D warnings
      - name: cargo clippy --lib (async-std)
        run: cargo clippy --lib --no-default-features --features async-std-runtime,async-std-native-tls,json,client-cache -- -D warnings

  # Compile a curated set of feature combinations (compile-only, no server
  # needed). Cargo features are additive, so `--no-default-features` is used to
  # pin exactly one runtime per entry — otherwise the default `tokio-runtime`
  # would mask a broken `async-std-runtime` build. This is what would have
  # caught CACHE-04 (`client-cache` + `async-std-runtime` does not compile).
  check-features:
    name: Check features (${{ matrix.features }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    strategy:
      fail-fast: false
      matrix:
        features:
          # tokio runtime
          - tokio-runtime
          - tokio-runtime,pool,json,client-cache
          - tokio-runtime,tokio-rustls,pool,json,client-cache
          - tokio-runtime,tokio-native-tls,pool,json,client-cache
          # async-std runtime (pool is tokio-only by design — bb8 constraint)
          - async-std-runtime
          - async-std-runtime,json,client-cache
          - async-std-runtime,async-std-native-tls,json,client-cache
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: cargo check --no-default-features --features ${{ matrix.features }}
        run: cargo check --no-default-features --features ${{ matrix.features }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Create Redis containers
        run: |
          cd /home/runner/work/rustis/rustis/redis/
          sh ./docker_up.sh
      - name: Wait for Redis to be ready
        timeout-minutes: 3
        run: |
          # `docker compose up -d` returns as soon as the containers start,
          # not when Redis is serving or the cluster has finished forming.
          # Launching the tests too early makes cluster clients loop on
          # reconnection forever, so gate the test step on readiness.
          echo "Waiting for standalone node..."
          until docker exec redis-standalone redis-cli ping 2>/dev/null | grep -q PONG; do
            sleep 1
          done
          echo "Waiting for cluster to reach cluster_state:ok..."
          until docker exec redis-node1 redis-cli -p 7000 cluster info 2>/dev/null | grep -q "cluster_state:ok"; do
            sleep 1
          done
          echo "Redis is ready."
      - name: Run cargo test
        run: cargo test --release --features pool,tokio-rustls,json,client-cache -- --test-threads=1
