  redis-node6:
    image: redis:${REDIS_VERSION:-8.8-alpine}
    container_name: redis-node6
    ports: ["7005:7005", "17005:17005"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "ping"]
